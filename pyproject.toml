[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrpa"
version = "0.1.0"
description = "基于图像识别的流程自动化工具 (RPA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyrpa" }]
keywords = ["rpa", "automation", "image-recognition", "pyautogui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "keyboard==0.13.5",
    "Pillow==12.3.0",
    "pyautogui==0.9.54",
    "pyperclip==1.11.0",
    "pywin32==312",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyinstaller>=6.0",
]

[project.scripts]
pyrpa = "main:main"

[tool.hatch.build.targets.wheel]
packages = []
include = ["main.py", "gui_editor.py"]
force-include = { "rpa_data" = "rpa_data", "theme" = "theme", "sun-valley.tcl" = "sun-valley.tcl" }
exclude = ["vendor"]

[tool.ruff]
line-length = 100
target-version = "py311"
